# Haxe and Neko releases also ship 32-bit Linux archives: mise could pick them,
# so each platform names its archive.
[tools.haxe]
version = "3.2.1"

[tools.haxe.platforms]
linux-x64 = { asset_pattern = "haxe-3.2.1-linux64.tar.gz" }
macos-x64 = { asset_pattern = "haxe-3.2.1-osx.tar.gz" }
macos-arm64 = { asset_pattern = "haxe-3.2.1-osx.tar.gz" }

[tools.neko]
version = "2-1-0"

[tools.neko.platforms]
linux-x64 = { asset_pattern = "neko-2.1.0-linux64.tar.gz" }
macos-x64 = { asset_pattern = "neko-2.1.0-osx64.tar.gz" }
macos-arm64 = { asset_pattern = "neko-2.1.0-osx64.tar.gz" }

[env]
# Neko loads its libneko and ndll files from here: DYLD on macOS, LD on Linux.
DYLD_LIBRARY_PATH = "{{env.HOME}}/.local/share/mise/installs/neko/2-1-0"
LD_LIBRARY_PATH = "{{env.HOME}}/.local/share/mise/installs/neko/2-1-0"
NEKOPATH = "{{env.HOME}}/.local/share/mise/installs/neko/2-1-0"
HAXE_STD_PATH = "{{env.HOME}}/.local/share/mise/installs/haxe/3.2.1/std"
# Project-local haxelib repo, filled by tools/install-deps.sh.
HAXELIB_PATH = "{{config_root}}/.haxelib"

# Run `mise tasks` to list them, `mise run <task>` to run one.
[tasks.install]
description = "Install the haxelibs of both builds, Haxe 4 for the JS build (html5/mise.toml), and the npm test tools"
run = [
  "bash tools/install-deps.sh",
  "mise -C html5 install",
  "mise -C html5 exec -- bash install-deps.sh",
  "npm ci --no-audit --no-fund",
]

[tasks."check:protocol"]
description = "Check the offline server and the 180 levels"
run = "haxe -cp . -cp src/com -D version2_1 -resource data/levels.json@levels -main tools.ProtocolCheck --interp"

[tasks."check:progress"]
description = "Check the player's progress"
run = "haxe -cp . -cp src/com -D version2_1 -resource data/levels.json@levels -main tools.ProgressCheck --interp"

[tasks."check:atlas"]
description = "Check how TexturePacker atlases are read"
run = "haxe -cp . -cp client -main tools.AtlasCheck --interp"

[tasks."test:levels"]
description = "Test the level extraction (without the videos)"
dir = "{{config_root}}/tools/levels"
run = [
  "uv run test_classify_cells.py",
  "uv run test_read_hud.py",
  "uv run test_build_levels.py",
]

[tasks."test:web"]
description = "Test the web page's scripts"
run = "node --test 'web/*.test.mjs'"

[tasks.test]
description = "Run every test that needs no video"
depends = ["check:protocol", "check:progress", "check:atlas", "html5:check:atlas", "html5:check:h2d", "html5:check:sound", "html5:check:assets", "html5:check:boot", "html5:check:spritelib", "test:levels", "test:web"]

[tasks.build]
description = "Build the release Flash client"
run = "bash tools/build-flash.sh client release"

[tasks.web]
description = "Assemble the web version in dist/web: the Flash page at /, the PixiJS page at /pixi/"
depends = ["build"]
run = [
  "bash tools/build-web.sh",
  "mise -C html5 exec -- haxe build.hxml",
  "mise -C html5 exec -- haxe game.hxml",
]

[tasks.serve]
description = "Serve the web version on http://localhost:8000"
depends = ["web"]
run = "python3 -m http.server 8000 --directory dist/web"

# The JS build (PixiJS) runs in html5/, with Haxe 4.3.7 from html5/mise.toml.
[tasks."html5:check:atlas"]
description = "Check how TexturePacker atlases are read, with Haxe 4"
run = "mise -C html5 exec -- haxe --cwd .. -cp . -cp client -main tools.AtlasCheck --interp"

[tasks."html5:check:h2d"]
description = "Check the h2d layer of the JS build (what it draws), compiled to JS and run by Node like the browser would"
run = [
  "mise -C html5 exec -- haxe --cwd .. -cp . -cp client -cp .haxelib/h3d/git -cp html5/src -D h3d --macro \"addGlobalMetadata('', '@:build(FlashDefaults.build())', true, true, false)\" -main tools.H2dCheck -js dist/checks/h2d.js",
  "node dist/checks/h2d.js",
]

[tasks."html5:check:sound"]
description = "Check the game's Sfx on the JS build's sound classes, with a fake audio backend (compiled to JS, run by Node)"
run = [
  "mise -C html5 exec -- haxe --cwd .. -cp . -cp client -cp .haxelib/h3d/git -cp html5/src -D h3d --macro \"addGlobalMetadata('', '@:build(FlashDefaults.build())', true, true, false)\" -main tools.SoundCheck -js dist/checks/sound.js",
  "node dist/checks/sound.js",
]

[tasks."html5:check:assets"]
description = "Check how the JS build serves preloaded assets (compiled to JS, run by Node)"
run = [
  "mise -C html5 exec -- haxe --cwd .. -cp . -cp client -cp .haxelib/h3d/git -cp html5/src -D h3d --macro \"addGlobalMetadata('', '@:build(FlashDefaults.build())', true, true, false)\" -main tools.AssetCheck -js dist/checks/assets.js",
  "node dist/checks/assets.js",
]

[tasks."html5:check:boot"]
description = "Check the JS build's progress store and asset list (compiled to JS, run by Node)"
run = [
  "mise -C html5 exec -- haxe --cwd .. -cp . -cp client -cp client/client -cp src/com -cp .haxelib/h3d/git -cp html5/src -D h3d --macro \"addGlobalMetadata('', '@:build(FlashDefaults.build())', true, true, false)\" -main tools.BootCheck -js dist/checks/boot.js",
  "node dist/checks/boot.js",
]

[tasks."html5:check:spritelib"]
description = "Check the SpriteLib (BLib, HSprite, AnimManager) on the h2d layer, with Haxe 4"
run = "mise -C html5 exec -- haxe --cwd .. -cp . -cp client -cp .haxelib/h3d/git -cp html5/src -D h3d --macro \"addGlobalMetadata('', '@:build(FlashDefaults.build())', true, true, false)\" -main tools.SpriteLibCheck --interp"

[tasks."test:site"]
description = "Check the built site in headless Chrome: run `mise run web` first"
run = [
  "mise -C html5 exec -- haxe common.hxml -main Demo -debug -js ../dist/html5-test/main.js",
  "npx playwright test",
]
