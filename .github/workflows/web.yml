name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Neko's system libraries
        # Ubuntu mirrors sometimes time out or answer 503: retry before failing.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgc1 libpcre3

      - uses: jdx/mise-action@v2

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('tools/install-deps.sh') }}

      - uses: actions/cache@v4
        with:
          path: html5/.haxelib
          key: haxelib-html5-${{ runner.os }}-${{ hashFiles('html5/install-deps.sh') }}

      - name: Install
        run: |
          mise trust html5/mise.toml
          mise run install

      - name: Test
        run: mise run test

      - name: Build the site
        run: mise run web

      - name: Test the built site
        run: mise run test:site  # Chrome is preinstalled on GitHub's runners

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
