name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Neko's system libraries
        # Ubuntu mirrors sometimes time out or answer 503: retry before failing.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgc1 libpcre3

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('tools/install-deps.sh') }}

      - name: Install haxelibs
        run: mise run install

      - name: Install Haxe 4 and Neko 2.4 for the JS build
        run: |
          mise trust html5/mise.toml
          mise -C html5 install

      - uses: actions/cache@v4
        with:
          path: html5/.haxelib
          key: haxelib-html5-${{ runner.os }}-${{ hashFiles('html5/install-deps.sh') }}

      - name: Install the JS build's haxelibs
        run: mise run html5:install

      - name: Check the offline server and the 180 levels
        run: mise run check:protocol

      - name: Check the player's progress
        run: mise run check:progress

      - name: Check how atlases are read
        run: mise run check:atlas

      - name: Check how atlases are read, with Haxe 4
        run: mise run html5:check:atlas

      - uses: astral-sh/setup-uv@v6

      - name: Test the level extraction
        run: mise run test:levels

      - name: Test the web page's scripts
        run: mise run test:web  # Node is preinstalled on GitHub's runners

      - name: Build the Flash client
        run: mise run build

      - name: Assemble the web version
        run: bash tools/build-web.sh  # not `mise run web`: the client is already built

      - name: Build the JS client
        run: mise run html5:build  # after build-web.sh, which empties dist/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
