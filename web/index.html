<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockfaller Journey</title>
<!-- Texts from Motion-Twin's rockfaller.com (Wayback Machine, October 2015). -->
<meta name="description" content="Rockfaller Journey: A challenging but relaxing puzzle adventure!">
<meta property="og:type" content="game">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://cmnemoi.github.io/rockfaller/">
<meta property="og:title" content="Rockfaller Journey: A challenging but relaxing puzzle adventure!">
<meta property="og:description" content="A match 4 puzzle game that will engage your brain and challenge your intelligence. Climb aboard the Mole’O’Matic and tunnel your way to the center of the Earth!">
<meta property="og:image" content="https://cmnemoi.github.io/rockfaller/img/ogFb.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Rockfaller Journey">
<meta name="twitter:description" content="Rockfaller Journey: A challenging but relaxing puzzle adventure!">
<link rel="icon" href="favicon.ico">
<style>
  /* Colours, fonts and layout of the original game page (data-rockfaller.twinoid.com/css/80/style.css). */
  @font-face { font-family: "benchnine"; src: url("font/BenchNine-Regular.ttf") format("truetype"); font-display: swap; }
  :root { --night: #05060b; --ink: #4A5980; --link: #FFFFAA; --glow: #0a89f3; --shadow: #0B0D11; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--night) url("img/bg_game.jpg") top center / cover no-repeat fixed;
    color: var(--ink); font: 14px/1.5 "benchnine", Arial, sans-serif;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px; min-height: 0; padding: 16px 16px 0; }
  nav ul { margin: 0; padding: 0; list-style: none; text-align: right; transform: scale(0.8, 1); transform-origin: right; }
  nav li { margin-bottom: 10px; }
  nav a { color: var(--link); text-decoration: none; text-transform: uppercase; font-size: 1.7em; }
  nav a:hover, nav a:focus-visible, nav a[aria-current] {
    color: white; transition: all 180ms ease-out;
    text-shadow: 0 2px 10px var(--glow), 2px 0 10px var(--glow), 2px 2px 10px var(--glow), 0 0 10px var(--glow);
  }
  nav { width: 130px; align-self: flex-start; margin-top: 120px; }
  /* Two rows of three, so the flags stay narrower than the menu above them. */
  .languages { display: grid; grid-template-columns: repeat(3, 16px); gap: 8px; justify-content: end; margin: 16px 0 0; padding: 0; list-style: none; }
  .languages li { margin: 0; line-height: 0; }
  /* Twinoid's flags at their own size (data.twinoid.com/img/flags). */
  .languages img { display: block; width: 16px; height: 11px; opacity: 0.4; transition: opacity 180ms ease-out; }
  .languages a:hover img, .languages a:focus-visible img, .languages a[aria-current] img { opacity: 1; }
  #game { height: min(100%, 768px); aspect-ratio: 640 / 768; max-width: 100%; box-shadow: 0 0 15px var(--shadow); }
  #game ruffle-player { width: 100%; height: 100%; }
  /* Lighter than the original ink (#4A5980), unreadable at this size on the night background. */
  footer { padding: 8px 16px 12px; color: #A9B4CF; font-size: 13px; text-align: center; }
  footer a { color: var(--link); }
  @media (max-width: 820px) {
    main { flex-direction: column; justify-content: flex-start; }
    nav { width: auto; margin-top: 0; }
    nav ul { display: flex; gap: 18px; transform: none; }
    nav li { margin: 0; }
    .languages { grid-template-columns: repeat(6, 16px); justify-content: start; margin-top: 10px; }
    #game { width: 100%; height: auto; }
  }
</style>
</head>
<body>
<main>
  <nav aria-label="Rockfaller Journey">
    <ul>
      <li><a href="./" aria-current="page" data-text="play">Jouer</a></li>
      <li><a href="https://github.com/cmnemoi/rockfaller" data-text="source">Code source</a></li>
      <li><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" data-text="licence">Licence</a></li>
    </ul>
    <ul class="languages" aria-label="Langue">
      <li><a href="?lang=fr" hreflang="fr" lang="fr" title="Français"><img src="img/flags/fr.png" alt="Français"></a></li>
      <li><a href="?lang=en" hreflang="en" lang="en" title="English"><img src="img/flags/en.png" alt="English"></a></li>
      <li><a href="?lang=es" hreflang="es" lang="es" title="Español"><img src="img/flags/es.png" alt="Español"></a></li>
      <li><a href="?lang=de" hreflang="de" lang="de" title="Deutsch"><img src="img/flags/de.png" alt="Deutsch"></a></li>
      <li><a href="?lang=it" hreflang="it" lang="it" title="Italiano"><img src="img/flags/it.png" alt="Italiano"></a></li>
      <li><a href="?lang=pt" hreflang="pt" lang="pt" title="Português"><img src="img/flags/pt.png" alt="Português"></a></li>
    </ul>
  </nav>
  <div id="game"></div>
</main>
<footer>
  Rockfaller Journey, © Motion-Twin, <span data-text="licensed">sous licence</span>
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.
  <span data-text="emulation">Émulation Flash par</span> <a href="https://ruffle.rs">Ruffle</a>.
</footer>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", letterbox: "on", splashScreen: true };
</script>
<script src="ruffle/ruffle.js"></script>
<script type="module">
  import { chooseLanguage } from "./language.mjs";

  const PAGE_TEXTS = {
    fr: { play: "Jouer", source: "Code source", licence: "Licence", languages: "Langue", licensed: "sous licence", emulation: "Émulation Flash par" },
    en: { play: "Play", source: "Source code", licence: "License", languages: "Language", licensed: "licensed under", emulation: "Flash emulation by" },
    es: { play: "Jugar", source: "Código fuente", licence: "Licencia", languages: "Idioma", licensed: "bajo licencia", emulation: "Emulación Flash con" },
    de: { play: "Spielen", source: "Quellcode", licence: "Lizenz", languages: "Sprache", licensed: "lizenziert unter", emulation: "Flash-Emulation durch" },
    it: { play: "Gioca", source: "Codice sorgente", licence: "Licenza", languages: "Lingua", licensed: "con licenza", emulation: "Emulazione Flash di" },
    pt: { play: "Jogar", source: "Código-fonte", licence: "Licença", languages: "Idioma", licensed: "sob licença", emulation: "Emulação Flash por" },
  };
  const SAVED_LANGUAGE_KEY = "rockfaller.language";

  // Storage can be blocked (private window, cleared site data): the page still works without it.
  function savedLanguage() {
    try { return localStorage.getItem(SAVED_LANGUAGE_KEY); } catch { return null; }
  }
  function saveLanguage(language) {
    try { localStorage.setItem(SAVED_LANGUAGE_KEY, language); } catch {}
  }

  const requested = new URLSearchParams(location.search).get("lang");
  const language = chooseLanguage({ requested, saved: savedLanguage(), browserLanguages: navigator.languages ?? [] });
  if (requested === language) saveLanguage(language);

  document.documentElement.lang = language;
  for (const element of document.querySelectorAll("[data-text]")) element.textContent = PAGE_TEXTS[language][element.dataset.text];
  document.querySelector(".languages").setAttribute("aria-label", PAGE_TEXTS[language].languages);
  document.querySelector(`.languages a[hreflang="${language}"]`).setAttribute("aria-current", "true");

  const player = window.RufflePlayer.newest().createPlayer();
  document.getElementById("game").appendChild(player);
  player.ruffle().load({ url: "rockfaller.swf", parameters: { lang: language } });
</script>
</body>
</html>
